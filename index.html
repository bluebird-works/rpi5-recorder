<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RPi5 REC</title>
<style>
  :root { color-scheme: light dark; }
  body {
    font-family: system-ui, sans-serif;
    max-width: 380px; margin: 0 auto; padding: 24px;
    display: flex; flex-direction: column; gap: 14px;
  }
  h1 { font-size: 18px; margin: 0 0 4px; }
  button {
    padding: 22px; font-size: 20px; border: none; border-radius: 14px;
    color: #fff; cursor: pointer;
  }
  button:disabled { opacity: .35; cursor: not-allowed; }
  #conn { background: #2980b9; }
  #disc { background: #7f8c8d; padding: 12px; font-size: 14px; }
  #snap { background: #16a085; padding: 14px; font-size: 16px; }
  #rec  { background: #c0392b; }
  #stop { background: #555; }
  #reset { background: #d35400; padding: 10px; font-size: 13px; }
  select#preset {
    padding: 12px; font-size: 15px; border-radius: 10px;
    border: 1px solid #bbb; background: #fff; color: #222;
  }
  label.field { font-size: 12px; color: #666; margin-top: -8px; }
  #snapWrap { margin: 0; }
  #snapImg { width: 100%; border-radius: 10px; display: block; background: #eee; }
  #snapTs { font-size: 12px; color: #666; text-align: center; margin-top: 6px; }
  #status {
    display: flex; align-items: center; gap: 10px;
    padding: 12px; border-radius: 10px; background: #f2f2f2;
    color: #222; font-size: 14px;
  }
  #dot { width: 14px; height: 14px; border-radius: 50%; background: #888; }
  #dot.on { background: #e74c3c; animation: blink 1s infinite; }
  @keyframes blink { 50% { opacity: .2; } }
  #log { font-size: 11px; color: #888; word-break: break-all; min-height: 14px; }
  .warn {
    padding: 10px; font-size: 12px; background: #fff3cd; color: #856404;
    border-radius: 8px;
  }
  details { font-size: 12px; color: #888; }
  details summary { cursor: pointer; padding: 6px 0; }
  details input {
    display: block; width: 100%; box-sizing: border-box;
    padding: 8px; margin: 4px 0 8px;
    font-family: monospace; font-size: 12px;
    border: 1px solid #bbb; border-radius: 6px;
  }
  details label { font-size: 11px; color: #666; }
  .debug {
    padding: 10px; font-size: 12px; background: #e8f4fd; color: #1a5a8a;
    border-radius: 8px; text-align: center;
  }
  .debug a { color: #1a5a8a; font-weight: 600; }
</style>
</head>
<body>
  <h1>RPi5 відео-реєстратор</h1>

  <div id="unsupported" class="warn" hidden>
    Web Bluetooth недоступний. Потрібен Chrome/Edge на Android або desktop
    (HTTPS). iOS Safari, Firefox не підтримують.
  </div>

  <button id="conn">Підключити</button>
  <button id="disc" hidden>Відключити</button>

  <label class="field" for="preset">Формат</label>
  <select id="preset">
    <option value="0">1080p @ 30 fps · HW · дефолт</option>
    <option value="1">720p @ 30 fps · HW · легкий</option>
    <option value="2">1296p @ 30 fps · SW · треба охолодження</option>
    <option value="3">1536×864 @ 120 fps · SW · турель, кроп FoV</option>
    <option value="4">2304×1296 @ 56 fps · SW · турель, full FoV</option>
  </select>

  <details id="manualPanel">
    <summary>Ручні налаштування (перевизначає пресет)</summary>
    <label style="display:flex;gap:8px;align-items:center;margin:8px 0">
      <input id="manualEnabled" type="checkbox">
      Використати мануальні параметри
    </label>
    <label>Width (128–4608)</label>
    <input id="mWidth" type="number" min="128" max="4608" value="1536">
    <label>Height (96–2592)</label>
    <input id="mHeight" type="number" min="96" max="2592" value="864">
    <label>FPS (1–120)</label>
    <input id="mFps" type="number" min="1" max="120" value="120">
    <label>Bitrate, bps (500k–100M)</label>
    <input id="mBitrate" type="number" min="500000" max="100000000" step="500000" value="8000000">
    <label>Encoder</label>
    <select id="mEncoder" style="width:100%;padding:8px;margin:4px 0 8px;border:1px solid #bbb;border-radius:6px">
      <option value="auto">auto (Pi 4=HW, Pi 5=SW)</option>
      <option value="hardware">hardware (Pi 4 тільки)</option>
      <option value="software" selected>software (обовʼязково для Pi 5 і >1920 ширини)</option>
    </select>
    <label>Shutter (мкс, 0=auto). Проти motion blur — 2000–5000</label>
    <input id="mShutter" type="number" min="0" max="1000000" step="100" value="0">
    <label>Autofocus mode</label>
    <select id="mAf" style="width:100%;padding:8px;margin:4px 0 8px;border:1px solid #bbb;border-radius:6px">
      <option value="manual" selected>manual (фіксований фокус)</option>
      <option value="continuous">continuous</option>
      <option value="auto">auto</option>
    </select>
    <label>Lens position (0=inf, число=діоптрії, "default"=гіперфокал)</label>
    <input id="mLens" value="0">
  </details>

  <button id="snap" disabled>📸 Знімок для перевірки кадрування</button>
  <figure id="snapWrap" hidden>
    <img id="snapImg" alt="snapshot">
    <figcaption id="snapTs"></figcaption>
  </figure>

  <button id="rec"  disabled>● Запис</button>
  <button id="stop" disabled>■ Стоп</button>

  <div id="status"><span id="dot"></span><span id="label">не підключено</span></div>
  <div id="log"></div>

  <details>
    <summary>Налаштування BLE</summary>
    <label>Device name</label>
    <input id="name" value="RPi5-CAM">
    <label>Service UUID</label>
    <input id="svc" value="12345678-1234-5678-1234-56789abcdef0">
    <label>Command characteristic UUID</label>
    <input id="chr" value="12345678-1234-5678-1234-56789abcdef1">
    <label>Status characteristic UUID</label>
    <input id="chrStatus" value="12345678-1234-5678-1234-56789abcdef2">
    <label>Snapshot characteristic UUID</label>
    <input id="chrSnap" value="12345678-1234-5678-1234-56789abcdef3">
    <button id="saveCfg" style="background:#27ae60;padding:10px;font-size:13px">
      Зберегти
    </button>
  </details>

  <button id="reset">🔄 Скинути зʼєднання (якщо не підключається)</button>

  <div class="debug">
    Не бачить пристрій?
    <a href="https://googlechrome.github.io/samples/web-bluetooth/get-characteristics.html"
       target="_blank" rel="noopener">Google Debugger</a>
  </div>

<script>
"use strict";

const DEFAULTS = {
  name: "RPi5-CAM",
  svc:  "12345678-1234-5678-1234-56789abcdef0",
  chr:  "12345678-1234-5678-1234-56789abcdef1",
  chrStatus: "12345678-1234-5678-1234-56789abcdef2",
  chrSnap:   "12345678-1234-5678-1234-56789abcdef3",
};

const sleep = ms => new Promise(r => setTimeout(r, ms));

const $ = id => document.getElementById(id);
const log = m => { $("log").textContent = m; console.log(m); };
const setLabel = t => $("label").textContent = t;
const setRecUI = rec => {
  $("dot").classList.toggle("on", rec);
  setLabel(rec ? "запис…" : "готово");
};

function loadCfg() {
  const saved = JSON.parse(localStorage.getItem("bleCfg") || "{}");
  const cfg = { ...DEFAULTS, ...saved };
  for (const k of Object.keys(DEFAULTS)) $(k).value = cfg[k];
  return cfg;
}

function saveCfg() {
  const cfg = {};
  for (const k of Object.keys(DEFAULTS)) cfg[k] = $(k).value.trim();
  localStorage.setItem("bleCfg", JSON.stringify(cfg));
  log("налаштування збережено");
}

if (!("bluetooth" in navigator)) {
  $("unsupported").hidden = false;
  $("conn").disabled = true;
}

let chrCmd = null;
let chrStatus = null;
let chrSnap = null;
let device = null;

function setConnectedUI(on) {
  $("conn").hidden = on;
  $("disc").hidden = !on;
  $("rec").disabled = !on;
  $("stop").disabled = !on;
  $("snap").disabled = !on || !chrSnap;
}

function resetConnectionState() {
  chrCmd = null;
  chrStatus = null;
  chrSnap = null;
  device = null;
  setConnectedUI(false);
  $("dot").classList.remove("on");
}

async function connect() {
  try {
    // Якщо є стара сесія — валимо її ДО requestDevice, інакше Pi думає
    // що ми все ще підключені й наступний коннект висне.
    if (device?.gatt?.connected) {
      try { device.gatt.disconnect(); } catch (_) {}
    }

    const cfg = loadCfg();
    const svc  = cfg.svc.toLowerCase();
    const cuid = cfg.chr.toLowerCase();
    const suid = cfg.chrStatus.toLowerCase();

    device = await navigator.bluetooth.requestDevice({
      filters: [{ name: cfg.name }],
      optionalServices: [svc],
    });
    log("обрано " + device.name);

    device.addEventListener("gattserverdisconnected", () => {
      setLabel("зв'язок втрачено");
      resetConnectionState();
    });

    // BlueZ/адаптер інколи розриває GATT-сесію відразу після connect (адаптер
    // не встиг доскинути ATT-таблицю). Один retry рятує в 90% випадків, а
    // подальші вже не мають сенсу — краще користувачу натиснути ще раз.
    let service;
    try {
      const gatt = await device.gatt.connect();
      service = await gatt.getPrimaryService(svc);
    } catch (e) {
      if (!/disconnected/i.test(e.message)) throw e;
      log("GATT drop, retry...");
      await sleep(400);
      const gatt = await device.gatt.connect();
      service = await gatt.getPrimaryService(svc);
    }
    chrCmd = await service.getCharacteristic(cuid);
    try { chrStatus = await service.getCharacteristic(suid); } catch (_) {}
    try {
      chrSnap = await service.getCharacteristic(cfg.chrSnap.toLowerCase());
      log("snap: ok");
    } catch (e) {
      chrSnap = null;
      log("snap: недоступний (" + e.message + ")");
    }

    if (chrStatus) {
      const v = await chrStatus.readValue();
      setRecUI(v.getUint8(0) === 0x01);
    } else {
      setLabel("підключено");
    }

    setConnectedUI(true);
    log("підключено до " + device.name);
  } catch (e) {
    log("помилка: " + e.message);
    setLabel("помилка підключення");
    resetConnectionState();
  }
}

function disconnect() {
  if (device?.gatt?.connected) {
    try { device.gatt.disconnect(); } catch (_) {}
  }
  resetConnectionState();
  setLabel("відключено");
  log("відключено вручну");
}

async function sendStart(preset) {
  if (!chrCmd) return;
  await chrCmd.writeValue(Uint8Array.of(0x01, preset & 0xff));
}

// Manual mode: одним GATT write кидаємо cmd byte 0x03 + UTF-8 JSON.
// Payload ≤ MTU-3 (~180 B на стандартному ATT_MTU=185); шлемо тільки задані поля.
async function sendStartManual(cfg) {
  if (!chrCmd) return;
  const json = new TextEncoder().encode(JSON.stringify(cfg));
  const packet = new Uint8Array(1 + json.length);
  packet[0] = 0x03;
  packet.set(json, 1);
  if (packet.length > 180) {
    log("manual config занадто великий (" + packet.length + " B)");
    return;
  }
  await chrCmd.writeValue(packet);
}

function collectManual() {
  const cfg = {
    width:      parseInt($("mWidth").value,   10),
    height:     parseInt($("mHeight").value,  10),
    fps:        parseInt($("mFps").value,     10),
    bitrate:    parseInt($("mBitrate").value, 10),
    encoder:    $("mEncoder").value,
    shutter_us: parseInt($("mShutter").value, 10) || 0,
    af_mode:    $("mAf").value,
    lens_position: $("mLens").value.trim() || "0",
  };
  for (const k of ["width", "height", "fps", "bitrate"]) {
    if (!Number.isFinite(cfg[k]) || cfg[k] <= 0) {
      log("manual: заповни поле " + k);
      return null;
    }
  }
  return cfg;
}

function saveManualToStorage() {
  const cfg = collectManual();
  if (cfg) localStorage.setItem("manualCfg", JSON.stringify(cfg));
  localStorage.setItem("manualEnabled", $("manualEnabled").checked ? "1" : "0");
}

function loadManualFromStorage() {
  const saved = localStorage.getItem("manualCfg");
  if (saved) {
    try {
      const cfg = JSON.parse(saved);
      if (cfg.width)   $("mWidth").value   = cfg.width;
      if (cfg.height)  $("mHeight").value  = cfg.height;
      if (cfg.fps)     $("mFps").value     = cfg.fps;
      if (cfg.bitrate) $("mBitrate").value = cfg.bitrate;
      if (cfg.encoder) $("mEncoder").value = cfg.encoder;
      if (cfg.shutter_us != null) $("mShutter").value = cfg.shutter_us;
      if (cfg.af_mode) $("mAf").value = cfg.af_mode;
      if (cfg.lens_position != null) $("mLens").value = cfg.lens_position;
    } catch (_) {}
  }
  $("manualEnabled").checked = localStorage.getItem("manualEnabled") === "1";
}

async function sendStop() {
  if (!chrCmd) return;
  await chrCmd.writeValue(Uint8Array.of(0x00));
}

async function snapshot() {
  if (!chrCmd || !chrSnap) return;
  $("snap").disabled = true;
  const prevLabel = $("label").textContent;
  setLabel("знімок...");
  try {
    await chrCmd.writeValue(Uint8Array.of(0x02));
    const chunks = [];
    let total = null;
    const started = Date.now();
    while (Date.now() - started < 20000) {
      const v = await chrSnap.readValue();
      const buf = new Uint8Array(v.buffer, v.byteOffset, v.byteLength);
      if (buf.length < 4) { await sleep(150); continue; }
      const seq = buf[0] | (buf[1] << 8);
      const chunkTotal = buf[2] | (buf[3] << 8);
      // total=0 = ще не готовий, чекаємо
      if (chunkTotal === 0) { await sleep(150); continue; }
      if (total === null) {
        if (seq !== 0) { log("skew: seq=" + seq); break; }
        total = chunkTotal;
      }
      chunks.push(buf.slice(4));
      if (seq === total - 1) break;
    }
    if (total === null || chunks.length !== total) {
      log("знімок timeout або битий (" + chunks.length + "/" + total + ")");
      return;
    }
    const combined = concatChunks(chunks);
    const dv = new DataView(combined.buffer, combined.byteOffset, combined.byteLength);
    const tsMs = Number(dv.getBigUint64(0, true));
    const jpeg = combined.slice(8);
    const oldSrc = $("snapImg").src;
    if (oldSrc && oldSrc.startsWith("blob:")) URL.revokeObjectURL(oldSrc);
    const url = URL.createObjectURL(new Blob([jpeg], { type: "image/jpeg" }));
    $("snapImg").src = url;
    $("snapWrap").hidden = false;
    $("snapTs").textContent =
      new Date(tsMs).toLocaleString("uk-UA") +
      " · " + jpeg.length.toLocaleString("uk-UA") + " байт";
    log(`знімок ${jpeg.length} байт, ${total} чанків`);
  } catch (e) {
    log("помилка знімка: " + e.message);
  } finally {
    setLabel(prevLabel);
    $("snap").disabled = $("dot").classList.contains("on") || !chrSnap;
  }
}

function concatChunks(chunks) {
  const size = chunks.reduce((s, c) => s + c.length, 0);
  const out = new Uint8Array(size);
  let off = 0;
  for (const c of chunks) { out.set(c, off); off += c.length; }
  return out;
}

// Pi думає що ми ще підключені поки не отримає GATT-disconnect. Без цього
// закриття вкладки лишає mostro-connection, і наступного разу потрібно чистити
// site data. Робимо явний disconnect при закритті.
window.addEventListener("pagehide", () => {
  if (device?.gatt?.connected) {
    try { device.gatt.disconnect(); } catch (_) {}
  }
});

loadCfg();
loadManualFromStorage();
const savedPreset = localStorage.getItem("preset");
if (savedPreset !== null) $("preset").value = savedPreset;
$("preset").addEventListener("change", () =>
  localStorage.setItem("preset", $("preset").value));
for (const id of ["mWidth","mHeight","mFps","mBitrate","mEncoder","mShutter","mAf","mLens","manualEnabled"]) {
  $(id).addEventListener("change", saveManualToStorage);
}

// Скидання для юзерів, які не вміють чистити кеш браузера / забувати пристрій
// у BT-налаштуваннях телефона. Робить максимум що дозволяє Web Bluetooth API:
// 1) розриває GATT-сесію (щоб Pi не думав, що ми ще підключені),
// 2) через device.forget() (Chrome 114+) прибирає пристрій зі списку дозволених
//    для цього origin — Chrome при наступному коннекті знову покаже picker,
// 3) hard-reload сторінки з обходом кешу.
// Кеш ОС/Bluetooth-стеку (GATT services cache) з JS почистити неможливо —
// це вирішує тільки «забути пристрій» у системних налаштуваннях BT.
async function fullReset() {
  $("reset").disabled = true;
  try {
    if (device?.gatt?.connected) {
      try { device.gatt.disconnect(); } catch (_) {}
    }
    if (device && typeof device.forget === "function") {
      try { await device.forget(); log("пристрій забуто у браузері"); } catch (_) {}
    }
  } finally {
    // невелика пауза щоб disconnect дійшов до Pi
    setTimeout(() => location.reload(), 300);
  }
}

$("saveCfg").onclick = saveCfg;
$("conn").onclick = connect;
$("disc").onclick = disconnect;
$("snap").onclick = snapshot;
$("reset").onclick = fullReset;
$("rec").onclick  = async () => {
  if ($("manualEnabled").checked) {
    const cfg = collectManual();
    if (!cfg) return;
    await sendStartManual(cfg);
  } else {
    const preset = parseInt($("preset").value, 10) || 0;
    await sendStart(preset);
  }
  setRecUI(true);
  // Під час запису rpicam-jpeg не працює — камера зайнята.
  $("snap").disabled = true;
};
$("stop").onclick = async () => {
  await sendStop();
  setRecUI(false);
  $("snap").disabled = !chrSnap;
};
</script>
</body>
</html>
